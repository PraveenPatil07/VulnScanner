name: Code Vulnerability Scan

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      threshold:
        description: 'Severity threshold for quality gate'
        required: false
        default: 'HIGH'
        type: choice
        options:
          - CRITICAL
          - HIGH
          - MEDIUM
          - LOW

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # For SARIF upload

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install scanner dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pyyaml

      - name: Run vulnerability scan
        id: scan
        run: |
          python -m backend.cli scan . \
            --format sarif \
            --output scan-results.sarif \
            --threshold ${{ github.event.inputs.threshold || 'HIGH' }}
        continue-on-error: true

      - name: Generate JSON report
        if: always()
        run: |
          python -m backend.cli scan . --format json --output scan-results.json

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: scan-results.sarif
          category: code-vulnerability-scanner

      - name: Upload scan results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulnerability-scan-results
          path: |
            scan-results.json
            scan-results.sarif

      - name: Comment on PR with findings summary
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const results = JSON.parse(fs.readFileSync('scan-results.json', 'utf8'));
            const severity = results.findings_by_severity || {};
            const total = results.total_findings || 0;

            let body = `## 🔒 Vulnerability Scan Results\n\n`;
            body += `| Metric | Value |\n|--------|-------|\n`;
            body += `| Files Scanned | ${results.files_scanned} |\n`;
            body += `| Total Findings | ${total} |\n`;
            body += `| Critical | ${severity.CRITICAL || 0} |\n`;
            body += `| High | ${severity.HIGH || 0} |\n`;
            body += `| Medium | ${severity.MEDIUM || 0} |\n`;
            body += `| Low | ${severity.LOW || 0} |\n`;
            body += `| Duration | ${(results.scan_duration_ms / 1000).toFixed(1)}s |\n\n`;

            if (total === 0) {
              body += `✅ No vulnerabilities detected!\n`;
            } else {
              body += `### Top Findings\n\n`;
              for (const f of results.findings.slice(0, 5)) {
                body += `- **[${f.severity}]** ${f.title} — \`${f.file_path}:${f.line_number}\` (${f.cwe_id})\n`;
              }
              if (total > 5) body += `\n_...and ${total - 5} more_\n`;
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body,
            });

      - name: Quality Gate Check
        if: steps.scan.outcome == 'failure'
        run: |
          echo "::error::Quality gate failed — findings at or above threshold detected"
          exit 1
