language: c
category: HARDCODED_SECRETS
rules:
  - id: C-SECRET-001
    name: "Hardcoded credentials in C"
    description: "Passwords or keys hardcoded in C source code."
    severity: HIGH
    cwe: "CWE-798"
    cvss_score: 7.5
    cvss_vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N"
    mitre_attack: "T1552.001"
    nist_csf:
      - "PR.AC-01"
      - "PR.DS-05"
    confidence: HIGH
    false_positive_risk: MEDIUM
    remediation: "Read credentials from environment variables, configuration files with restricted permissions, or a secrets manager."
    references:
      - "https://cwe.mitre.org/data/definitions/798.html"
    patterns:
      - type: regex
        pattern: "(?:password|passwd|secret|api_key|apikey|token)\\s*(?:\\[\\d*\\])?\\s*=\\s*\"[^\"]{8,}\""
        flags: [MULTILINE]
      - type: regex
        pattern: "#define\\s+(?:PASSWORD|SECRET|API_KEY|TOKEN|AUTH)\\w*\\s+\"[^\"]{8,}\""
        flags: [MULTILINE]
    false_positive_filters:
      - "getenv"
      - "placeholder|example|dummy|test|TODO"
      - "^\\s*//"
      - "^\\s*\\*"
      - "credential.helper|credential_helper"
      - "fill_credential|store_credential|reject_credential"
