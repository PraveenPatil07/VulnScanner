language: cpp
category: HARDCODED_SECRETS
rules:
  - id: CPP-SECRET-001
    name: "Hardcoded credentials in C++"
    description: "Passwords, API keys, or tokens hardcoded in C++ source code."
    severity: HIGH
    cwe: "CWE-798"
    cvss_score: 7.5
    cvss_vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N"
    mitre_attack: "T1552.001"
    nist_csf:
      - "PR.AC-01"
      - "PR.DS-05"
    confidence: HIGH
    false_positive_risk: MEDIUM
    remediation: "Store secrets in environment variables or a secrets manager. Use std::getenv()."
    references:
      - "https://cwe.mitre.org/data/definitions/798.html"
    patterns:
      - type: regex
        pattern: "(?:password|passwd|secret|api_key|apikey|token|auth_key)\\s*=\\s*\"[^\"]{8,}\""
        flags: [MULTILINE]
      - type: regex
        pattern: "#define\\s+(?:PASSWORD|SECRET|API_KEY|TOKEN|AUTH)\\w*\\s+\"[^\"]{8,}\""
        flags: [MULTILINE]
      - type: regex
        pattern: "(?:std::string|const\\s+char\\s*\\*)\\s+\\w*(?:password|secret|key|token)\\w*\\s*=\\s*\"[^\"]{8,}\""
        flags: [MULTILINE]
    false_positive_filters:
      - "getenv"
      - "placeholder|example|dummy|test|TODO"
      - "^\\s*//"
      - "^\\s*\\*"
