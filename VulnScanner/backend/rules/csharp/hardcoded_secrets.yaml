language: csharp
category: HARDCODED_SECRET
rules:
  - id: "CS-SECRET-001"
    name: "Hardcoded password in source code"
    description: "Detects hardcoded passwords assigned to variables or passed as parameters. Hardcoded credentials can be extracted from compiled assemblies and used to compromise systems."
    severity: HIGH
    cwe: "CWE-798"
    cvss_score: 7.5
    cvss_vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N"
    mitre_attack: "T1552.001"
    nist_csf: ["PR.AC-1", "PR.DS-5"]
    confidence: MEDIUM
    false_positive_risk: MEDIUM
    remediation: "Store secrets in a secure vault (Azure Key Vault, AWS Secrets Manager, HashiCorp Vault) or use environment variables. Use IConfiguration with User Secrets for development."
    references:
      - "https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html"
      - "https://learn.microsoft.com/en-us/aspnet/core/security/app-secrets"
    patterns:
      - type: regex
        pattern: '(?:password|passwd|pwd|secret)\s*=\s*"[^"]{8,}"'
        flags: [MULTILINE, IGNORECASE]
      - type: regex
        pattern: '(?:Password|password)\s*=\s*"[^"]{4,}"'
        flags: [MULTILINE]
      - type: regex
        pattern: 'new\s+(?:NetworkCredential|SqlCredential)\s*\([^)]*"[^"]{4,}"[^)]*\)'
        flags: [MULTILINE]
    false_positive_filters:
      - 'Configuration\['
      - 'Environment\.GetEnvironmentVariable'
      - 'GetValue<'
      - '//\s*nosec'
      - '\{\s*get;\s*set;\s*\}'
      - 'example|placeholder|changeme|xxx'

  - id: "CS-SECRET-002"
    name: "Hardcoded connection string with credentials"
    description: "Detects connection strings with embedded passwords in source code. Database credentials in source code are exposed in version control and compiled binaries."
    severity: HIGH
    cwe: "CWE-798"
    cvss_score: 7.5
    cvss_vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N"
    mitre_attack: "T1552.001"
    nist_csf: ["PR.AC-1", "PR.DS-5"]
    confidence: HIGH
    false_positive_risk: LOW
    remediation: "Move connection strings to appsettings.json (excluded from source control), environment variables, or a secrets manager. Use Integrated Security/Trusted_Connection where possible."
    references:
      - "https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html"
      - "https://learn.microsoft.com/en-us/dotnet/framework/data/adonet/connection-strings"
    patterns:
      - type: regex
        pattern: '(?:connection[_\s]?string|connStr|connectionString)\s*=\s*"[^"]*(?:Password|Pwd)\s*=[^"]*"'
        flags: [MULTILINE, IGNORECASE]
      - type: regex
        pattern: '"(?:Server|Data Source)\s*=[^"]*;\s*(?:Password|Pwd)\s*=[^"]*"'
        flags: [MULTILINE, IGNORECASE]
      - type: regex
        pattern: 'SqlConnection\s*\(\s*"[^"]*(?:Password|Pwd)\s*=[^"]*"'
        flags: [MULTILINE, IGNORECASE]
    false_positive_filters:
      - 'Configuration\['
      - 'GetConnectionString'
      - 'appsettings'
      - 'IConfiguration'
      - '//\s*nosec'

  - id: "CS-SECRET-003"
    name: "Hardcoded API key or private key"
    description: "Detects hardcoded API keys, tokens, or private key material in C# source files. These secrets grant access to external services and should never be committed to source control."
    severity: HIGH
    cwe: "CWE-798"
    cvss_score: 7.5
    cvss_vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N"
    mitre_attack: "T1552.001"
    nist_csf: ["PR.AC-1", "PR.DS-5"]
    confidence: MEDIUM
    false_positive_risk: MEDIUM
    remediation: "Use a secrets manager or environment variables for API keys. For certificates, use the certificate store or Azure Key Vault. Never embed cryptographic key material in source code."
    references:
      - "https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html"
      - "https://cwe.mitre.org/data/definitions/798.html"
    patterns:
      - type: regex
        pattern: '(?:api[_\-]?key|apikey|api[_\-]?secret|auth[_\-]?token|access[_\-]?token)\s*=\s*"[A-Za-z0-9+/=_\-]{20,}"'
        flags: [MULTILINE, IGNORECASE]
      - type: regex
        pattern: '"-----BEGIN\s+(?:RSA\s+)?PRIVATE\s+KEY-----'
        flags: [MULTILINE]
      - type: regex
        pattern: '(?:Bearer|Basic)\s+[A-Za-z0-9+/=_\-]{20,}'
        flags: [MULTILINE]
    false_positive_filters:
      - 'Configuration\['
      - 'Environment\.GetEnvironmentVariable'
      - 'IOptions<'
      - '//\s*nosec'
      - 'example|placeholder|test|dummy'
