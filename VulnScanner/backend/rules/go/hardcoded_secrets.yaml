language: go
category: HARDCODED_SECRET
rules:
  - id: GO-SECRET-001
    name: "Hardcoded password/secret in Go"
    description: "Password or secret value hardcoded in Go source code."
    severity: HIGH
    cwe: "CWE-798"
    cvss_score: 7.5
    cvss_vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N"
    mitre_attack: "T1552"
    nist_csf: ["PR.AC-01", "PR.DS-05"]
    confidence: MEDIUM
    false_positive_risk: MEDIUM
    remediation: "Use environment variables via os.Getenv() or a configuration management tool."
    references:
      - "https://cwe.mitre.org/data/definitions/798.html"
    patterns:
      - type: regex
        pattern: '(?i)(?:password|passwd|secret|apiKey|api_key|token)\s*(?::=|=)\s*"[^"]{8,}"'
        flags: [MULTILINE]
    false_positive_filters:
      - 'os\.Getenv'
      - '(?i)(example|test|dummy|fake|placeholder)'
      - '^\s*//'

  - id: GO-SECRET-002
    name: "Hardcoded API key in Go"
    description: "API key hardcoded in Go source."
    severity: HIGH
    cwe: "CWE-798"
    cvss_score: 7.5
    cvss_vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N"
    mitre_attack: "T1552"
    nist_csf: ["PR.AC-01", "PR.DS-05"]
    confidence: HIGH
    false_positive_risk: LOW
    remediation: "Load API keys from environment variables or a secrets manager."
    references:
      - "https://cwe.mitre.org/data/definitions/798.html"
    patterns:
      - type: regex
        pattern: 'AKIA[0-9A-Z]{16}'
        flags: [MULTILINE]
      - type: regex
        pattern: '"sk-[a-zA-Z0-9]{48,}"'
        flags: [MULTILINE]
    false_positive_filters:
      - 'os\.Getenv'
      - '^\s*//'

  - id: GO-SECRET-003
    name: "Private key in Go source"
    description: "Private key embedded in Go source code."
    severity: CRITICAL
    cwe: "CWE-798"
    cvss_score: 9.1
    cvss_vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N"
    mitre_attack: "T1552"
    nist_csf: ["PR.AC-01", "PR.DS-05"]
    confidence: HIGH
    false_positive_risk: LOW
    remediation: "Load private keys from files at runtime."
    references:
      - "https://cwe.mitre.org/data/definitions/798.html"
    patterns:
      - type: regex
        pattern: '-----BEGIN\s+(RSA\s+|EC\s+|DSA\s+)?PRIVATE\s+KEY-----'
        flags: [MULTILINE]
    false_positive_filters:
      - '^\s*//'
      - '(?i)(test|example|mock)'
