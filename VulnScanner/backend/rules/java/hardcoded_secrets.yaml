language: java
category: HARDCODED_SECRET
rules:
  - id: JAVA-SECRET-001
    name: "Hardcoded password in Java"
    description: "Password or secret hardcoded in Java source code."
    severity: HIGH
    cwe: "CWE-798"
    cvss_score: 7.5
    cvss_vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N"
    mitre_attack: "T1552"
    nist_csf: ["PR.AC-01", "PR.DS-05"]
    confidence: MEDIUM
    false_positive_risk: MEDIUM
    remediation: "Use environment variables, configuration files outside version control, or a secrets manager."
    references:
      - "https://cwe.mitre.org/data/definitions/798.html"
    patterns:
      - type: regex
        pattern: '(?i)(password|passwd|pwd|secret|apiKey|api_key)\s*=\s*"[^"]{8,}"'
        flags: [MULTILINE]
    false_positive_filters:
      - '(?i)(example|test|dummy|fake|placeholder|your_|changeme)'
      - 'System\.getenv'
      - '^\s*//'

  - id: JAVA-SECRET-002
    name: "Hardcoded database credentials"
    description: "Database connection URL with embedded credentials in Java source."
    severity: HIGH
    cwe: "CWE-798"
    cvss_score: 7.5
    cvss_vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N"
    mitre_attack: "T1552"
    nist_csf: ["PR.AC-01", "PR.DS-05"]
    confidence: HIGH
    false_positive_risk: LOW
    remediation: "Use environment variables or external configuration for database credentials."
    references:
      - "https://cwe.mitre.org/data/definitions/798.html"
    patterns:
      - type: regex
        pattern: '(?i)jdbc:[a-z]+://[^"]*(?:password|user)=[^"&]+'
        flags: [MULTILINE]
    false_positive_filters:
      - '(?i)(localhost|127\.0\.0\.1|example)'
      - '^\s*//'

  - id: JAVA-SECRET-003
    name: "Private key in Java source"
    description: "Private key embedded in Java source code."
    severity: CRITICAL
    cwe: "CWE-798"
    cvss_score: 9.1
    cvss_vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N"
    mitre_attack: "T1552"
    nist_csf: ["PR.AC-01", "PR.DS-05"]
    confidence: HIGH
    false_positive_risk: LOW
    remediation: "Load keys from a KeyStore or secrets manager."
    references:
      - "https://cwe.mitre.org/data/definitions/798.html"
    patterns:
      - type: regex
        pattern: '-----BEGIN\s+(RSA\s+|EC\s+|DSA\s+)?PRIVATE\s+KEY-----'
        flags: [MULTILINE]
    false_positive_filters:
      - '^\s*//'
      - '(?i)(test|example|mock)'
