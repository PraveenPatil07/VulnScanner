language: javascript
category: HARDCODED_SECRET
rules:
  - id: JS-SECRET-001
    name: "Hardcoded password or secret"
    description: "Password or secret value hardcoded in JavaScript source code."
    severity: HIGH
    cwe: "CWE-798"
    cvss_score: 7.5
    cvss_vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N"
    mitre_attack: "T1552"
    nist_csf: ["PR.AC-01", "PR.DS-05"]
    confidence: MEDIUM
    false_positive_risk: MEDIUM
    remediation: "Use environment variables (process.env.SECRET) or a secrets manager."
    references:
      - "https://cwe.mitre.org/data/definitions/798.html"
    patterns:
      - type: regex
        pattern: '(?i)(password|passwd|pwd|secret_key|secret|api_key|apikey|auth_token|access_token)\s*[:=]\s*["\x27`][^\s"\x27`]{8,}["\x27`]'
        flags: [MULTILINE]
    false_positive_filters:
      - 'process\.env'
      - '(?i)(placeholder|example|test|dummy|fake|your_|changeme|xxx)'
      - '^\s*//'

  - id: JS-SECRET-002
    name: "Hardcoded API key in JavaScript"
    description: "API key hardcoded in JavaScript source code. Exposed keys can be extracted from client-side bundles."
    severity: HIGH
    cwe: "CWE-798"
    cvss_score: 7.5
    cvss_vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N"
    mitre_attack: "T1552"
    nist_csf: ["PR.AC-01", "PR.DS-05"]
    confidence: HIGH
    false_positive_risk: LOW
    remediation: "Use environment variables or server-side proxies for API keys."
    references:
      - "https://cwe.mitre.org/data/definitions/798.html"
    patterns:
      - type: regex
        pattern: 'AKIA[0-9A-Z]{16}'
        flags: [MULTILINE]
      - type: regex
        pattern: 'sk-[a-zA-Z0-9]{48,}'
        flags: [MULTILINE]
      - type: regex
        pattern: 'ghp_[a-zA-Z0-9]{36}'
        flags: [MULTILINE]
    false_positive_filters:
      - '^\s*//'
      - '(?i)(example|test|mock|fake)'

  - id: JS-SECRET-003
    name: "Hardcoded JWT token"
    description: "JWT token hardcoded in JavaScript source code."
    severity: HIGH
    cwe: "CWE-798"
    cvss_score: 7.5
    cvss_vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N"
    mitre_attack: "T1552"
    nist_csf: ["PR.AC-01", "PR.DS-05"]
    confidence: HIGH
    false_positive_risk: LOW
    remediation: "Generate tokens dynamically. Never store tokens in source code."
    references:
      - "https://cwe.mitre.org/data/definitions/798.html"
    patterns:
      - type: regex
        pattern: '["\x27`]eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}["\x27`]'
        flags: [MULTILINE]
    false_positive_filters:
      - '^\s*//'
      - '(?i)(test|example|mock|sample)'

  - id: JS-SECRET-004
    name: "Private key in source"
    description: "Private key embedded directly in JavaScript source code."
    severity: CRITICAL
    cwe: "CWE-798"
    cvss_score: 9.1
    cvss_vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N"
    mitre_attack: "T1552"
    nist_csf: ["PR.AC-01", "PR.DS-05"]
    confidence: HIGH
    false_positive_risk: LOW
    remediation: "Load private keys from files or environment variables at runtime."
    references:
      - "https://cwe.mitre.org/data/definitions/798.html"
    patterns:
      - type: regex
        pattern: '-----BEGIN\s+(RSA\s+|EC\s+|DSA\s+|OPENSSH\s+)?PRIVATE\s+KEY-----'
        flags: [MULTILINE]
    false_positive_filters:
      - '^\s*//'
      - '(?i)(test|example|mock|sample)'
