language: kotlin
category: HARDCODED_SECRETS
rules:
  - id: KT-SECRET-001
    name: "Hardcoded credentials"
    description: "Passwords, API keys, or tokens hardcoded in Kotlin source code."
    severity: HIGH
    cwe: "CWE-798"
    cvss_score: 7.5
    cvss_vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N"
    mitre_attack: "T1552.001"
    nist_csf:
      - "PR.AC-01"
      - "PR.DS-05"
    confidence: HIGH
    false_positive_risk: MEDIUM
    remediation: "Store secrets in environment variables, Android Keystore, or a secrets manager."
    references:
      - "https://cwe.mitre.org/data/definitions/798.html"
    patterns:
      - type: regex
        pattern: "(?:val|var)\\s+\\w*(?:password|passwd|secret|apiKey|api_key|token|auth)\\w*\\s*=\\s*\"[^\"]{8,}\""
        flags: [MULTILINE]
      - type: regex
        pattern: "(?:password|apiKey|secretKey|accessToken)\\s*=\\s*\"[^\"]{8,}\""
        flags: [MULTILINE]
      - type: regex
        pattern: "(?:AKIA|sk-|ghp_|gho_)[A-Za-z0-9]{10,}"
        flags: [MULTILINE]
    false_positive_filters:
      - "BuildConfig\\."
      - "System\\.getenv"
      - "placeholder|example|dummy|test|TODO"
      - "^\\s*//"
