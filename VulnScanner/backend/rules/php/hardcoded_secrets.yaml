language: php
category: HARDCODED_SECRET
rules:
  - id: PHP-SECRET-001
    name: "Hardcoded password in PHP"
    description: "Password or secret hardcoded in PHP source code."
    severity: HIGH
    cwe: "CWE-798"
    cvss_score: 7.5
    cvss_vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N"
    mitre_attack: "T1552"
    nist_csf: ["PR.AC-01", "PR.DS-05"]
    confidence: MEDIUM
    false_positive_risk: MEDIUM
    remediation: "Use environment variables via getenv() or $_ENV, or a secrets manager."
    references:
      - "https://cwe.mitre.org/data/definitions/798.html"
    patterns:
      - type: regex
        pattern: '(?i)\$(?:password|passwd|pwd|secret|api_key|apikey|auth_token)\s*=\s*["\x27][^\s"\x27]{8,}["\x27]'
        flags: [MULTILINE]
    false_positive_filters:
      - 'getenv'
      - '\$_ENV'
      - '(?i)(example|test|dummy|fake|placeholder|changeme)'
      - '^\s*//'

  - id: PHP-SECRET-002
    name: "Database credentials in PHP config"
    description: "Database credentials hardcoded in PHP configuration files."
    severity: HIGH
    cwe: "CWE-798"
    cvss_score: 7.5
    cvss_vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N"
    mitre_attack: "T1552"
    nist_csf: ["PR.AC-01", "PR.DS-05"]
    confidence: MEDIUM
    false_positive_risk: MEDIUM
    remediation: "Use environment variables for database credentials."
    references:
      - "https://cwe.mitre.org/data/definitions/798.html"
    patterns:
      - type: regex
        pattern: '(?i)define\s*\(\s*["\x27]DB_(?:PASSWORD|PASS|USER)["\x27]\s*,\s*["\x27][^"\x27]{4,}["\x27]\s*\)'
        flags: [MULTILINE]
    false_positive_filters:
      - 'getenv'
      - '(?i)(example|test|root|localhost)'
      - '^\s*//'

  - id: PHP-SECRET-003
    name: "Private key in PHP source"
    description: "Private key embedded directly in PHP source code."
    severity: CRITICAL
    cwe: "CWE-798"
    cvss_score: 9.1
    cvss_vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N"
    mitre_attack: "T1552"
    nist_csf: ["PR.AC-01", "PR.DS-05"]
    confidence: HIGH
    false_positive_risk: LOW
    remediation: "Load keys from files at runtime with proper permissions."
    references:
      - "https://cwe.mitre.org/data/definitions/798.html"
    patterns:
      - type: regex
        pattern: '-----BEGIN\s+(RSA\s+|EC\s+|DSA\s+)?PRIVATE\s+KEY-----'
        flags: [MULTILINE]
    false_positive_filters:
      - '^\s*//'
      - '(?i)(test|example|mock)'
