language: python
category: HARDCODED_SECRET
rules:
  - id: PY-SECRET-001
    name: "Hardcoded password assignment"
    description: "Password or secret value hardcoded directly in source code. Exposed credentials can be used to gain unauthorized access."
    severity: HIGH
    cwe: "CWE-798"
    cvss_score: 7.5
    cvss_vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N"
    mitre_attack: "T1552"
    nist_csf: ["PR.AC-01", "PR.DS-05"]
    confidence: MEDIUM
    false_positive_risk: MEDIUM
    remediation: "Store secrets in environment variables or a secrets manager. Use os.environ.get() or a configuration library to load secrets at runtime."
    references:
      - "https://cwe.mitre.org/data/definitions/798.html"
    patterns:
      - type: regex
        pattern: '(?i)(password|passwd|pwd|secret_key|secret|api_key|apikey|auth_token|access_token)\s*=\s*["\x27][^\s"\x27]{8,}["\x27]'
        flags: [MULTILINE]
    false_positive_filters:
      - '(?i)(password|secret)\s*=\s*["\x27](None|null|empty|changeme|placeholder|xxx|your_|example|test|dummy|fake|sample)["\x27]'
      - 'os\.environ'
      - 'getenv'
      - '^\s*#'
      - 'config\[.*(password|secret)'

  - id: PY-SECRET-002
    name: "Hardcoded API key"
    description: "API key hardcoded in source code. Common patterns include AWS, OpenAI, Anthropic, and other service keys."
    severity: HIGH
    cwe: "CWE-798"
    cvss_score: 7.5
    cvss_vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N"
    mitre_attack: "T1552"
    nist_csf: ["PR.AC-01", "PR.DS-05"]
    confidence: HIGH
    false_positive_risk: LOW
    remediation: "Use environment variables or a secrets manager for API keys. Rotate any exposed keys immediately."
    references:
      - "https://cwe.mitre.org/data/definitions/798.html"
    patterns:
      - type: regex
        pattern: '(?i)(api_key|apikey|api_secret)\s*=\s*["\x27][a-zA-Z0-9_\-]{20,}["\x27]'
        flags: [MULTILINE]
      - type: regex
        pattern: 'AKIA[0-9A-Z]{16}'
        flags: [MULTILINE]
      - type: regex
        pattern: 'sk-[a-zA-Z0-9]{48,}'
        flags: [MULTILINE]
    false_positive_filters:
      - 'os\.environ'
      - 'getenv'
      - '^\s*#'
      - '(?i)(example|test|dummy|fake|placeholder|your_)'

  - id: PY-SECRET-003
    name: "Hardcoded JWT token"
    description: "JWT token hardcoded in source code. Attackers can use exposed tokens to impersonate users or access protected resources."
    severity: HIGH
    cwe: "CWE-798"
    cvss_score: 7.5
    cvss_vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N"
    mitre_attack: "T1552"
    nist_csf: ["PR.AC-01", "PR.DS-05"]
    confidence: HIGH
    false_positive_risk: LOW
    remediation: "Generate tokens dynamically at runtime. Never store tokens in source code."
    references:
      - "https://cwe.mitre.org/data/definitions/798.html"
    patterns:
      - type: regex
        pattern: '["\x27]eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}["\x27]'
        flags: [MULTILINE]
    false_positive_filters:
      - '^\s*#'
      - '(?i)(test|example|mock)'

  - id: PY-SECRET-004
    name: "Hardcoded private key"
    description: "Private key embedded directly in source code. Exposed private keys compromise the entire cryptographic security."
    severity: CRITICAL
    cwe: "CWE-798"
    cvss_score: 9.1
    cvss_vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N"
    mitre_attack: "T1552"
    nist_csf: ["PR.AC-01", "PR.DS-05"]
    confidence: HIGH
    false_positive_risk: LOW
    remediation: "Store private keys in a secrets manager or encrypted key store. Load from files at runtime with proper file permissions (600)."
    references:
      - "https://cwe.mitre.org/data/definitions/798.html"
    patterns:
      - type: regex
        pattern: '-----BEGIN\s+(RSA\s+|EC\s+|DSA\s+|OPENSSH\s+)?PRIVATE\s+KEY-----'
        flags: [MULTILINE]
    false_positive_filters:
      - '^\s*#'
      - '(?i)(test|example|mock|sample)'

  - id: PY-SECRET-005
    name: "Database connection string with embedded credentials"
    description: "Database connection string with username and password embedded directly in the source code."
    severity: HIGH
    cwe: "CWE-798"
    cvss_score: 7.5
    cvss_vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N"
    mitre_attack: "T1552"
    nist_csf: ["PR.AC-01", "PR.DS-05"]
    confidence: HIGH
    false_positive_risk: LOW
    remediation: "Use environment variables for database credentials. Construct connection strings from individual environment variables."
    references:
      - "https://cwe.mitre.org/data/definitions/798.html"
    patterns:
      - type: regex
        pattern: '(?i)(mysql|postgresql|postgres|mongodb|redis|mssql)://[^:]+:[^@]+@[^\s"\x27]+'
        flags: [MULTILINE]
    false_positive_filters:
      - '(?i)(localhost|127\.0\.0\.1|example\.com|your_)'
      - 'os\.environ'
      - '^\s*#'
