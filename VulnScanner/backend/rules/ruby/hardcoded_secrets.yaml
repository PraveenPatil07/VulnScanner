language: ruby
category: HARDCODED_SECRET
rules:
  - id: RB-SECRET-001
    name: "Hardcoded secret in Ruby"
    description: "Password or secret hardcoded in Ruby source code."
    severity: HIGH
    cwe: "CWE-798"
    cvss_score: 7.5
    cvss_vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N"
    mitre_attack: "T1552"
    nist_csf: ["PR.AC-01", "PR.DS-05"]
    confidence: MEDIUM
    false_positive_risk: MEDIUM
    remediation: "Use ENV['SECRET_KEY'] or Rails credentials."
    references:
      - "https://cwe.mitre.org/data/definitions/798.html"
    patterns:
      - type: regex
        pattern: '(?i)(?:password|secret_key|api_key|auth_token)\s*=\s*["\x27][^\s"\x27]{8,}["\x27]'
        flags: [MULTILINE]
    false_positive_filters:
      - 'ENV\['
      - '(?i)(example|test|dummy|placeholder)'
      - '^\s*#'

  - id: RB-SECRET-002
    name: "Private key in Ruby source"
    description: "Private key embedded in Ruby code."
    severity: CRITICAL
    cwe: "CWE-798"
    cvss_score: 9.1
    cvss_vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N"
    mitre_attack: "T1552"
    nist_csf: ["PR.AC-01", "PR.DS-05"]
    confidence: HIGH
    false_positive_risk: LOW
    remediation: "Load keys from files or Rails credentials."
    references:
      - "https://cwe.mitre.org/data/definitions/798.html"
    patterns:
      - type: regex
        pattern: '-----BEGIN\s+(RSA\s+|EC\s+|DSA\s+)?PRIVATE\s+KEY-----'
        flags: [MULTILINE]
    false_positive_filters:
      - '^\s*#'
      - '(?i)(test|fixture|spec)'

  - id: RB-SECRET-003
    name: "Rails secret_key_base hardcoded"
    description: "Rails secret_key_base hardcoded in configuration."
    severity: HIGH
    cwe: "CWE-798"
    cvss_score: 7.5
    cvss_vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N"
    mitre_attack: "T1552"
    nist_csf: ["PR.AC-01", "PR.DS-05"]
    confidence: HIGH
    false_positive_risk: LOW
    remediation: "Use Rails credentials or environment variables for secret_key_base."
    references:
      - "https://cwe.mitre.org/data/definitions/798.html"
    patterns:
      - type: regex
        pattern: 'secret_key_base\s*=\s*["\x27][a-f0-9]{30,}["\x27]'
        flags: [MULTILINE]
    false_positive_filters:
      - 'ENV\['
      - '^\s*#'
