language: rust
category: HARDCODED_SECRETS
rules:
  - id: RS-SECRET-001
    name: "Hardcoded credentials in Rust"
    description: "Passwords, API keys, or tokens hardcoded in Rust source code."
    severity: HIGH
    cwe: "CWE-798"
    cvss_score: 7.5
    cvss_vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N"
    mitre_attack: "T1552.001"
    nist_csf:
      - "PR.AC-01"
      - "PR.DS-05"
    confidence: HIGH
    false_positive_risk: MEDIUM
    remediation: "Use std::env::var() or a configuration crate (config, dotenvy) to load secrets from environment."
    references:
      - "https://cwe.mitre.org/data/definitions/798.html"
    patterns:
      - type: regex
        pattern: "(?:let|const|static)\\s+\\w*(?:PASSWORD|SECRET|API_KEY|TOKEN|AUTH)\\w*\\s*(?::\\s*&?str)?\\s*=\\s*\"[^\"]{8,}\""
        flags: [MULTILINE]
      - type: regex
        pattern: "(?:password|secret|api_key|token|auth_key)\\s*=\\s*\"[^\"]{8,}\""
        flags: [MULTILINE]
      - type: regex
        pattern: "(?:AKIA|sk-|ghp_|gho_)[A-Za-z0-9]{10,}"
        flags: [MULTILINE]
    false_positive_filters:
      - "std::env::var"
      - "env!"
      - "placeholder|example|dummy|test|TODO"
      - "^\\s*//"
