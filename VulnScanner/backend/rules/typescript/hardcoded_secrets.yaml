language: typescript
category: HARDCODED_SECRETS
rules:
  - id: TS-SECRET-001
    name: "Hardcoded API key or token"
    description: "API key, token, or secret hardcoded in source code."
    severity: HIGH
    cwe: "CWE-798"
    cvss_score: 7.5
    cvss_vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N"
    mitre_attack: "T1552.001"
    nist_csf:
      - "PR.AC-01"
      - "PR.DS-05"
    confidence: HIGH
    false_positive_risk: MEDIUM
    remediation: "Store secrets in environment variables or a secrets manager. Use process.env.SECRET_NAME."
    references:
      - "https://cwe.mitre.org/data/definitions/798.html"
    patterns:
      - type: regex
        pattern: "(?:api[_-]?key|api[_-]?secret|auth[_-]?token|access[_-]?token|secret[_-]?key)\\s*[:=]\\s*[\"'][A-Za-z0-9+/=_\\-]{16,}[\"']"
        flags: [MULTILINE]
      - type: regex
        pattern: "(?:password|passwd|pwd)\\s*[:=]\\s*[\"'][^\"']{8,}[\"']"
        flags: [MULTILINE]
      - type: regex
        pattern: "(?:AKIA|sk-|ghp_|gho_|github_pat_)[A-Za-z0-9]{10,}"
        flags: [MULTILINE]
    false_positive_filters:
      - "process\\.env\\."
      - "\\$\\{.*\\}"
      - "placeholder|example|dummy|test|fake|sample"
      - "^\\s*//"

  - id: TS-SECRET-002
    name: "JWT secret hardcoded"
    description: "JWT signing secret hardcoded in source code, allowing token forgery."
    severity: CRITICAL
    cwe: "CWE-798"
    cvss_score: 9.1
    cvss_vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N"
    mitre_attack: "T1552.001"
    nist_csf:
      - "PR.AC-01"
    confidence: HIGH
    false_positive_risk: LOW
    remediation: "Store JWT secret in environment variables or a key management service."
    references:
      - "https://cwe.mitre.org/data/definitions/798.html"
    patterns:
      - type: regex
        pattern: "(?:jwt|jsonwebtoken)\\.sign\\s*\\([^,]+,\\s*[\"'][^\"']{8,}[\"']"
        flags: [MULTILINE]
      - type: regex
        pattern: "(?:secret|jwtSecret|JWT_SECRET)\\s*[:=]\\s*[\"'][A-Za-z0-9+/=_\\-]{8,}[\"']"
        flags: [MULTILINE]
    false_positive_filters:
      - "process\\.env\\."
      - "placeholder|example|test"
