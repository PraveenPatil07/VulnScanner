language: universal
category: HARDCODED_SECRET
rules:
  - id: UNI-SECRET-001
    name: "Hardcoded password in config file"
    description: "Password or secret hardcoded in a configuration file. If committed to version control, credentials are exposed."
    severity: HIGH
    cwe: "CWE-798"
    cvss_score: 7.5
    cvss_vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N"
    mitre_attack: "T1552.001"
    nist_csf: ["PR.AC-01", "PR.DS-05"]
    confidence: HIGH
    false_positive_risk: LOW
    skip_languages: ["c", "cpp"]
    remediation: "Use environment variables or a secrets manager instead of hardcoding credentials in configuration files."
    references:
      - "https://cwe.mitre.org/data/definitions/798.html"
      - "https://owasp.org/Top10/A07_2021-Identification_and_Authentication_Failures/"
    patterns:
      - type: regex
        pattern: '(?i)(?:password|passwd|secret|api[._-]?key|token|credentials?)\s*[=:]\s*\S+'
        flags: [MULTILINE]
    false_positive_filters:
      - '(?i)(example|test|dummy|fake|placeholder|your_|changeme|TODO|FIXME|xxx|none|null|empty)'
      - '^\s*#'
      - '^\s*//'
      - '\$\{'
      - '\$\('
      - 'System\.getenv'
      - 'env\('
      - 'ENV\['
      - '(?i)password\s*[=:]\s*$'

  - id: UNI-SECRET-002
    name: "Database credentials in configuration"
    description: "Database connection with embedded username and password in configuration file."
    severity: HIGH
    cwe: "CWE-798"
    cvss_score: 7.5
    cvss_vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N"
    mitre_attack: "T1552.001"
    nist_csf: ["PR.AC-01", "PR.DS-05"]
    confidence: HIGH
    false_positive_risk: LOW
    skip_languages: ["c", "cpp", "python", "javascript", "typescript"]
    remediation: "Store database credentials in environment variables or use a vault/secrets manager."
    references:
      - "https://cwe.mitre.org/data/definitions/798.html"
    patterns:
      - type: regex
        pattern: '(?i)(?:datasource|database|db)[._](?:password|username)\s*[=:]\s*\S+'
        flags: [MULTILINE]
    false_positive_filters:
      - '(?i)(example|test|dummy|fake|placeholder|changeme|root_password)'
      - '^\s*#'
      - '\$\{'
