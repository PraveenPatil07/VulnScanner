language: universal
category: HARDCODED_SECRET
rules:
  - id: "UNI-SECRET-001"
    name: "AWS Access Key ID"
    description: "Detects AWS Access Key IDs (AKIA prefix) hardcoded in source files. Exposed AWS credentials can be used to access cloud resources, exfiltrate data, or incur charges."
    severity: CRITICAL
    cwe: "CWE-798"
    cvss_score: 9.8
    cvss_vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H"
    mitre_attack: "T1552.001"
    nist_csf: ["PR.AC-1", "PR.DS-5"]
    confidence: HIGH
    false_positive_risk: LOW
    remediation: "Use IAM roles, instance profiles, or environment variables. For local development, use AWS CLI profiles or aws-vault. Rotate any exposed keys immediately."
    references:
      - "https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html"
      - "https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html"
    patterns:
      - type: regex
        pattern: '(?:AKIA|ASIA)[0-9A-Z]{16}'
        flags: [MULTILINE]
      - type: regex
        pattern: '(?:aws_secret_access_key|aws_secret_key)\s*[=:]\s*["\''"]?[A-Za-z0-9/+=]{40}["\''"]?'
        flags: [MULTILINE, IGNORECASE]
      - type: regex
        pattern: 'AKIA[0-9A-Z]{16}\s*["\''"]?\s*(?:,|\n|;)'
        flags: [MULTILINE]
    false_positive_filters:
      - 'AKIAIOSFODNN7EXAMPLE'
      - 'example|placeholder|test|dummy|fake'
      - '//\s*nosec'
      - '#\s*nosec'

  - id: "UNI-SECRET-002"
    name: "GitHub Personal Access Token"
    description: "Detects GitHub personal access tokens (classic: ghp_, fine-grained: github_pat_) in source code. Exposed tokens grant repository access and can be used to steal code or inject malicious commits."
    severity: CRITICAL
    cwe: "CWE-798"
    cvss_score: 9.1
    cvss_vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N"
    mitre_attack: "T1552.001"
    nist_csf: ["PR.AC-1", "PR.DS-5"]
    confidence: HIGH
    false_positive_risk: LOW
    remediation: "Use GitHub Apps with installation tokens, GITHUB_TOKEN in Actions, or environment variables. Revoke exposed tokens immediately via GitHub settings."
    references:
      - "https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/managing-your-personal-access-tokens"
      - "https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html"
    patterns:
      - type: regex
        pattern: 'ghp_[A-Za-z0-9]{36}'
        flags: [MULTILINE]
      - type: regex
        pattern: 'github_pat_[A-Za-z0-9]{22}_[A-Za-z0-9]{59}'
        flags: [MULTILINE]
      - type: regex
        pattern: 'gho_[A-Za-z0-9]{36}'
        flags: [MULTILINE]
    false_positive_filters:
      - 'example|placeholder|test|dummy'
      - '//\s*nosec'
      - '#\s*nosec'

  - id: "UNI-SECRET-003"
    name: "OpenAI or Anthropic API Key"
    description: "Detects OpenAI (sk-) and Anthropic (sk-ant-) API keys hardcoded in source files. Exposed AI API keys can incur significant costs and expose proprietary prompts."
    severity: HIGH
    cwe: "CWE-798"
    cvss_score: 7.5
    cvss_vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N"
    mitre_attack: "T1552.001"
    nist_csf: ["PR.AC-1", "PR.DS-5"]
    confidence: HIGH
    false_positive_risk: LOW
    remediation: "Use environment variables (OPENAI_API_KEY, ANTHROPIC_API_KEY) or a secrets manager. Rotate exposed keys immediately via the provider's dashboard."
    references:
      - "https://platform.openai.com/docs/api-reference/authentication"
      - "https://docs.anthropic.com/en/docs/authentication"
    patterns:
      - type: regex
        pattern: 'sk-[A-Za-z0-9]{20}T3BlbkFJ[A-Za-z0-9]{20}'
        flags: [MULTILINE]
      - type: regex
        pattern: 'sk-ant-api[0-9]{2}-[A-Za-z0-9_\-]{80,}'
        flags: [MULTILINE]
      - type: regex
        pattern: 'sk-proj-[A-Za-z0-9_\-]{40,}'
        flags: [MULTILINE]
    false_positive_filters:
      - 'sk-xxxxxxx|sk-your|sk-test|sk-example'
      - '//\s*nosec'
      - '#\s*nosec'

  - id: "UNI-SECRET-004"
    name: "JSON Web Token (JWT) hardcoded"
    description: "Detects hardcoded JWT tokens in source code. JWTs may contain session information and their exposure can lead to authentication bypass or session hijacking."
    severity: MEDIUM
    cwe: "CWE-798"
    cvss_score: 6.5
    cvss_vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N"
    mitre_attack: "T1528"
    nist_csf: ["PR.AC-1", "PR.DS-5"]
    confidence: MEDIUM
    false_positive_risk: MEDIUM
    remediation: "Never hardcode JWTs. Generate tokens dynamically and store signing secrets in a vault. Use short-lived tokens with proper refresh mechanisms."
    references:
      - "https://cheatsheetseries.owasp.org/cheatsheets/JSON_Web_Token_for_Java_Cheat_Sheet.html"
      - "https://cwe.mitre.org/data/definitions/798.html"
    patterns:
      - type: regex
        pattern: 'eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}'
        flags: [MULTILINE]
    false_positive_filters:
      - 'test|example|sample|mock'
      - '\.spec\.|\.test\.|_test\.'
      - '//\s*nosec'
      - '#\s*nosec'

  - id: "UNI-SECRET-005"
    name: "Private key material in source"
    description: "Detects PEM-encoded private keys (RSA, EC, DSA, generic) embedded in source files. Private keys in source code can be extracted to impersonate services, decrypt traffic, or sign malicious artifacts."
    severity: CRITICAL
    cwe: "CWE-321"
    cvss_score: 9.1
    cvss_vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N"
    mitre_attack: "T1552.004"
    nist_csf: ["PR.DS-5", "PR.AC-1"]
    confidence: HIGH
    false_positive_risk: LOW
    remediation: "Store private keys in hardware security modules (HSMs), certificate stores, or secrets managers. Use environment variables to reference key file paths. Rotate any exposed keys immediately."
    references:
      - "https://cheatsheetseries.owasp.org/cheatsheets/Key_Management_Cheat_Sheet.html"
      - "https://cwe.mitre.org/data/definitions/321.html"
    patterns:
      - type: regex
        pattern: '-----BEGIN\s+(?:RSA\s+|EC\s+|DSA\s+|OPENSSH\s+)?PRIVATE\s+KEY-----'
        flags: [MULTILINE]
      - type: regex
        pattern: '-----BEGIN\s+PGP\s+PRIVATE\s+KEY\s+BLOCK-----'
        flags: [MULTILINE]
    false_positive_filters:
      - '\.pem\.example'
      - 'test[_\-]?key|sample[_\-]?key'
      - '//\s*nosec'
      - '#\s*nosec'

  - id: "UNI-SECRET-006"
    name: "Generic password or secret assignment"
    description: "Detects generic patterns of password or secret values being assigned in configuration or source files across any language."
    severity: MEDIUM
    cwe: "CWE-798"
    cvss_score: 6.5
    cvss_vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N"
    mitre_attack: "T1552.001"
    nist_csf: ["PR.AC-1", "PR.DS-5"]
    confidence: LOW
    false_positive_risk: HIGH
    remediation: "Use environment variables or a secrets manager for all credentials. Ensure .env files are in .gitignore and never committed to version control."
    references:
      - "https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html"
      - "https://cwe.mitre.org/data/definitions/798.html"
    patterns:
      - type: regex
        pattern: '(?:password|passwd|pwd|secret|token|api_key|apikey|auth_token|access_key)\s*[=:]\s*["\''"][^\s"''\'']{8,}["\''"]'
        flags: [MULTILINE, IGNORECASE]
      - type: regex
        pattern: '(?:DATABASE_PASSWORD|DB_PASSWORD|REDIS_PASSWORD|MONGO_PASSWORD)\s*[=:]\s*["\''"][^\s"''\'']{4,}["\''"]'
        flags: [MULTILINE, IGNORECASE]
    false_positive_filters:
      - 'example|placeholder|changeme|xxx|your_|<.*>'
      - 'process\.env|os\.environ|ENV\[|getenv'
      - '//\s*nosec'
      - '#\s*nosec'
      - '\.example$|\.template$|\.sample$'
